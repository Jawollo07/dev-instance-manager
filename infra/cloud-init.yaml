#cloud-config
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, git, build-essential, python3, python3-pip, nodejs, npm]
users:
  - default
  - name: coder
    gecos: Sandboxed developer
    shell: /bin/bash
    groups: [users]
    lock_passwd: true
    sudo: []
write_files:
  - path: /etc/default/code-server-gallery
    owner: root:root
    permissions: "0644"
    content: |
      EXTENSIONS_GALLERY='{"serviceUrl":"https://vs.code.de__WORKSPACE_BASE_PATH__/_dim-proxy/open-vsx/vscode/gallery","itemUrl":"https://vs.code.de__WORKSPACE_BASE_PATH__/_dim-proxy/open-vsx/vscode/item","resourceUrlTemplate":"https://vs.code.de__WORKSPACE_BASE_PATH__/_dim-proxy/open-vsx/vscode/unpkg/{publisher}/{name}/{version}/{path}","extensionUrlTemplate":"https://vs.code.de__WORKSPACE_BASE_PATH__/_dim-proxy/open-vsx/vscode/gallery/{publisher}/{name}/latest"}'
  - path: /etc/systemd/system/code-server.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Self-hosted VS Code Web workspace
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=simple
      User=coder
      Group=coder
      WorkingDirectory=/home/coder/project
      Environment=HOME=/home/coder
      EnvironmentFile=/etc/default/code-server-gallery
      # The manager replaces this with the user's URL slug during provisioning.
      ExecStart=/usr/bin/code-server --bind-addr 0.0.0.0:8080 --base-path __WORKSPACE_BASE_PATH__ --auth none --disable-telemetry --disable-update-check
      Restart=on-failure
      RestartSec=3
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=full
      ProtectHome=read-only
      ReadWritePaths=/home/coder
      [Install]
      WantedBy=multi-user.target
runcmd:
  - [bash, -lc, "curl -fsSL https://code-server.dev/install.sh | sh -s -- --method=deb"]
  - [install, -d, -o, coder, -g, coder, /home/coder/project]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, code-server.service]
