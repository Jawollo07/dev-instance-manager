# TLS edge proxy only. All application routing is owned by Fastify on port 3000.
# Define these zones once in the NGINX http {} context:
#   limit_req_zone $binary_remote_addr zone=dim_login:10m rate=5r/m;
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl http2;
    server_name vs.code.de;

    ssl_certificate     /etc/letsencrypt/live/vs.code.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vs.code.de/privkey.pem;

    server_tokens off;
    client_max_body_size 100m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Keep login throttling at the edge, but let the API handle the route itself.
    location = /api/auth/login {
        limit_req zone=dim_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # /admin, /assets/*, /api/* and /<workspace-slug>/* all reach Fastify.
    # Fastify serves the admin UI, exposes API endpoints, and proxies workspaces.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
