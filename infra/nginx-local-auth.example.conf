# Example NGINX site for the admin dashboard and per-user Basic Auth workspaces.
# Replace domain/TLS/filesystem paths. This is a reference, not a drop-in config.
# In the http {} context:
#   limit_req_zone $binary_remote_addr zone=dim_login:10m rate=5r/m;\n#   limit_req_zone $binary_remote_addr zone=dim_workspace:10m rate=20r/s;
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl http2;
    server_name vs.code.de;

    ssl_certificate     /etc/letsencrypt/live/vs.code.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vs.code.de/privkey.pem;

    root /opt/dev-instance-manager/web/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 100m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /admin {
        try_files /admin.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    location = /api/auth/login {
        limit_req zone=dim_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1200s;
        add_header Cache-Control "no-store" always;
    }

    # User routes are lowercase slugs, e.g. /test1 or /test23.
    # The API validates Basic Auth against both the username and the route slug.
    location ~ ^/([a-z0-9][a-z0-9-]{0,31})(/.*)?$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri =404;
    }
}
