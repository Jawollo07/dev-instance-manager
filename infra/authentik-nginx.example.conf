# Example snippets only; adapt to your NGINX and Authentik outpost.
# Protect dashboard, /api/ and /workspace/ with the same Authentik policy.
# Keep the API bound to 127.0.0.1:3000 and never expose it directly.
location = /outpost.goauthentik.io/auth/nginx {
    internal;
    proxy_pass http://authentik-server/outpost.goauthentik.io/auth/nginx;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-Method $request_method;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
}
# In the protected proxy context:
auth_request /outpost.goauthentik.io/auth/nginx;
auth_request_set $authentik_username $upstream_http_x_authentik_username;
proxy_set_header X-authentik-username $authentik_username;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
# Proxy /api/ and /workspace/ to http://127.0.0.1:3000.
